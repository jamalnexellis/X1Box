name: Android diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [codex/pgr2-startup-fix]
    paths:
      - .github/workflows/android-apk.yml
      - android/**
      - hw/xbox/**
      - hw/ide/**
      - include/hw/ide/**
      - include/hw/xbox/**
      - accel/tcg/**
      - target/i386/**
      - tcg/**
      - block/**
      - chardev/**
      - util/**
      - ui/**

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUSTUP_TOOLCHAIN: stable
      XEMU_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Preserve development APK signing identity
        uses: actions/cache@v4
        with:
          path: ${{ env.XEMU_DEBUG_KEYSTORE }}
          key: x1box-pgr2-development-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$(dirname "$XEMU_DEBUG_KEYSTORE")"
          if [ ! -f "$XEMU_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$XEMU_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Test read-only XISO media compatibility
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude hw/xbox/xiso_media.c android/test/cpp/test-xiso-media.c -o /tmp/test-xiso-media
          /tmp/test-xiso-media
      - name: Test Vulkan uniform packing
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I. -Iinclude android/test/cpp/test-uniform-copy.c -o /tmp/test-uniform-copy
          /tmp/test-uniform-copy
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config glslang-tools libvulkan-dev
          rustup target add aarch64-linux-android --toolchain stable
      - name: Check texture GPU test compilation
        run: cc -std=c11 -Wall -Wextra -Werror -I. -c android/test/cpp/test-texture-upload.c -o /tmp/test-texture-upload.o
      - name: Install Android toolchain
        run: |
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-36' 'build-tools;36.1.0' 'ndk;30.0.15729638' 'cmake;3.22.1'
      - name: Build installable diagnostic APK
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Compile native coroutine regression test
        run: |
          native_build=$(find android/app/.cxx -path '*/arm64-v8a/build.ninja' -print -quit)
          test -n "$native_build"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$(dirname "$native_build")" --target test-coroutine-android test-xiso-media test-uniform-copy test-texture-upload --parallel 2
          mkdir -p android/app/build/outputs/native-tests
          native_test=$(find android/app -type f -name test-coroutine-android -print -quit)
          test -n "$native_test"
          cp "$native_test" android/app/build/outputs/native-tests/
          media_test=$(find android/app -type f -name test-xiso-media -print -quit)
          test -n "$media_test"
          cp "$media_test" android/app/build/outputs/native-tests/
          uniform_test=$(find android/app -type f -name test-uniform-copy -print -quit)
          test -n "$uniform_test"
          cp "$uniform_test" android/app/build/outputs/native-tests/
          upload_test=$(find android/app -type f -name test-texture-upload -print -quit)
          test -n "$upload_test"
          cp "$upload_test" android/app/build/outputs/native-tests/
          python3 - <<'PY'
          import ast, pathlib, re
          header = pathlib.Path('hw/xbox/nv2a/pgraph/vk/texture-upload.h').read_text().split('static inline')[0]
          for name, output in [('texture_upload_glsl', 'texture-upload'), ('texture_upload_r16_glsl', 'texture-upload-r16')]:
              body = re.search(r'static const char ' + name + r'\[\]\s*=\s*(.*?);\s*\n', header, re.S).group(1)
              shader = ''.join(ast.literal_eval(s) for s in re.findall(r'"(?:[^"\\]|\\.)*"', body))
              pathlib.Path('/tmp/' + output + '.comp').write_text(shader)
          PY
          glslangValidator -V /tmp/texture-upload.comp -o android/app/build/outputs/native-tests/texture-upload.spv
          glslangValidator -V /tmp/texture-upload-r16.comp -o android/app/build/outputs/native-tests/texture-upload-r16.spv
          glslangValidator -V android/test/cpp/texture-sample.comp -o android/app/build/outputs/native-tests/texture-sample.spv
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: x1box-pgr2-diagnostic-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/native-tests/test-coroutine-android
            android/app/build/outputs/native-tests/test-xiso-media
            android/app/build/outputs/native-tests/test-uniform-copy
            android/app/build/outputs/native-tests/test-texture-upload
            android/app/build/outputs/native-tests/texture-upload.spv
            android/app/build/outputs/native-tests/texture-upload-r16.spv
            android/app/build/outputs/native-tests/texture-sample.spv
          compression-level: 0
