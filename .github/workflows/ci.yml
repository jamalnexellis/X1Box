name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.repository == 'xemu-project/xemu' || github.repository == 'izzy2lost/xemu'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
