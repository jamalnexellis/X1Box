name: Android diagnostic APK

on:
  workflow_dispatch:
  push:
    branches: [codex/pgr2-startup-fix]
    paths:
      - .github/workflows/android-apk.yml
      - android/**
      - hw/xbox/**
      - hw/ide/**
      - include/hw/ide/**
      - accel/tcg/**
      - target/i386/**
      - tcg/**
      - block/**
      - util/**
      - ui/**

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
          rustup target add aarch64-linux-android --toolchain stable
      - name: Install Android toolchain
        run: |
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-36' 'build-tools;36.1.0' 'ndk;30.0.15729638' 'cmake;3.22.1'
      - name: Build installable diagnostic APK
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Compile native coroutine regression test
        run: |
          native_build=$(find android/app/.cxx -path '*/arm64-v8a/build.ninja' -print -quit)
          test -n "$native_build"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$(dirname "$native_build")" --target test-coroutine-android --parallel 2
          mkdir -p android/app/build/outputs/native-tests
          native_test=$(find android/app -type f -name test-coroutine-android -print -quit)
          test -n "$native_test"
          cp "$native_test" android/app/build/outputs/native-tests/
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: x1box-pgr2-diagnostic-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/native-tests/test-coroutine-android
          compression-level: 0
